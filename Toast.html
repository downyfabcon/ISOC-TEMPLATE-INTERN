<!-- Toast Notifications Component -->
<!-- Uses dynamic component to switch between static div (disabled) and transition-group (animated) -->
<component 
  :is="animationsDisabled ? 'div' : 'transition-group'" 
  :name="animationsDisabled ? undefined : 'toast'" 
  :tag="animationsDisabled ? undefined : 'div'"
  class="toast toast-end toast-bottom z-[9999]"
>
  <div
    v-for="toast in toasts"
    :key="toast.id"
    class="alert shadow-lg"
    :class="{
      'alert-success': toast.type === 'success',
      'alert-error': toast.type === 'error',
      'alert-warning': toast.type === 'warning',
      'alert-info': toast.type === 'info'
    }"
    :data-toast-id="toast.id"
  >
    <!-- Success Icon -->
    <svg v-if="toast.type === 'success'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    
    <!-- Error Icon -->
    <svg v-if="toast.type === 'error'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    
    <!-- Warning Icon -->
    <svg v-if="toast.type === 'warning'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    
    <!-- Info Icon -->
    <svg v-if="toast.type === 'info'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    
    <span>{{ toast.message }}</span>
  </div>
</component>
